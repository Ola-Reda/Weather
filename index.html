<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather</title>
        <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <nav class="navbar navbar-expand-lg fixed-top py-4">
            <div class="container">
                <a class="navbar-brand text-white d-flex align-items-center justify-content-between" href="#">
                    <img src="images/logo.png">
                    <div class="ms-3">
                        <h1 class="fs-5 mb-0">Weather</h1>
                        <p class="fs-6 mb-0">tagline goes here</p>
                    </div>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>
                        <li class="nav-item">

                        <li class="nav-item">

                        <li class="nav-item">
                            <a class="nav-link" href="#">Photos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>

        <!--main-->
        <main class="d-flex align-items-center justify-content-center">

                    <button class="search-btn rounded-pill border-0">Search</button>
                </div>
                <div class="row result-box g-4 mt-5">
                    
                </div>
                <section class="load d-none align-items-center justify-content-center">
                    <div class="loader">
                        <div class="double-loader1"></div>
                        <div class="double-loader2"></div>
                    </div>

            </div>
        </main>
        <!--main-->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
